name: Survey Export Golden CI

on:
  pull_request:
    paths:
      - "app/api/admin/personnel-pack/survey-export/route.ts"
      - "tests/admin/survey-export-golden.test.ts"
      - "tests/fixtures/survey-export.golden.json"
      - ".github/workflows/survey-export-golden-ci.yml"
  push:
    paths:
      - "app/api/admin/personnel-pack/survey-export/route.ts"
      - "tests/admin/survey-export-golden.test.ts"
      - "tests/fixtures/survey-export.golden.json"
      - ".github/workflows/survey-export-golden-ci.yml"

permissions:
  contents: read

concurrency:
  group: lims-box-survey-export-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/fixture?connect_timeout=1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run survey-export golden regression
        run: node --import tsx --test tests/admin/survey-export-golden.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build
