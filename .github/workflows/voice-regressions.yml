name: Voice regressions
on: [push, pull_request]
jobs:
  wake-phrase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/voice -p 'test_*wake*.py'
      - run: python -m unittest discover -s tests/voice -p 'test_inline_command_punctuation.py'
