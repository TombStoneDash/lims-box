# Visual Check deploy gate: TombStoneDash/visual-check action.yml, pinned to
# visual-check main @ 1b6867f5d35fd0fc793c8d589f9dc5c2fb7522bb (PR #50). Baselines are committed under
# visual-check/baselines; recapture them with "Run workflow" + refresh.
name: visual-check
on:
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: Recapture baselines and open a PR with them
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  gate:
    if: github.event_name == 'pull_request' || !inputs.refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: TombStoneDash/visual-check@1b6867f5d35fd0fc793c8d589f9dc5c2fb7522bb
        with:
          config: visual-check/visual-check.config.mjs
          project: lims
  refresh-baselines:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: TombStoneDash/visual-check@1b6867f5d35fd0fc793c8d589f9dc5c2fb7522bb
        with:
          config: visual-check/visual-check.config.mjs
          mode: refresh
      - name: Open a PR with the new baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="visual-check/refresh-baselines-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add visual-check/baselines
          git diff --cached --quiet && { echo "Baselines unchanged."; exit 0; }
          git commit -m "chore(visual-check): refresh baselines"
          git push origin "$branch"
          gh pr create --title "chore(visual-check): refresh baselines" --body "Recaptured by the refresh-baselines job. Review the PNGs before merging."
  temp-seed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: TombStoneDash/visual-check@1b6867f5d35fd0fc793c8d589f9dc5c2fb7522bb
        with:
          config: visual-check/visual-check.config.mjs
          mode: refresh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add visual-check/baselines && git commit -m "ci: seed baselines from ubuntu runner" && git push
