name: Personnel Pack Fulfillment CI

on:
  pull_request:
    paths:
      - "app/api/personnel-pack-download/route.ts"
      - "app/personnel-pack/EmailGateForm.tsx"
      - "lib/emailValidation.ts"
      - "lib/notify.ts"
      - "lib/personnelPackFulfillment.ts"
      - "lib/supabase.ts"
      - "public/personnel-pack-assets/**"
      - "tests/personnel-pack/**"
      - "docs/personnel-pack-fulfillment-security.md"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/personnel-pack-fulfillment-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/api/personnel-pack-download/route.ts"
      - "app/personnel-pack/EmailGateForm.tsx"
      - "lib/emailValidation.ts"
      - "lib/notify.ts"
      - "lib/personnelPackFulfillment.ts"
      - "lib/supabase.ts"
      - "public/personnel-pack-assets/**"
      - "tests/personnel-pack/**"
      - "docs/personnel-pack-fulfillment-security.md"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/personnel-pack-fulfillment-ci.yml"

permissions:
  contents: read

concurrency:
  group: lims-box-personnel-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/fixture?connect_timeout=1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Personnel Pack fulfillment tests
        run: npm run test:personnel-pack

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build
