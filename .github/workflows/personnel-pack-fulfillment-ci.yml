name: Personnel Pack Fulfillment CI

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Vercel PREVIEW deployment URL (https://*.vercel.app). Never production."
        required: true
        type: string
  pull_request:
    paths:
      - "app/api/personnel-pack-download/**"
      - "lib/personnel-pack/**"
      - "lib/personnelPackDownloadClaims.ts"
      - "tests/personnel-pack-fulfillment*.test.ts"
      - "prisma/**"
      - "app/personnel-pack/EmailGateForm.tsx"
      - "lib/emailValidation.ts"
      - "lib/notify.ts"
      - "lib/personnelPackFulfillment.ts"
      - "lib/supabase.ts"
      - "public/personnel-pack-assets/**"
      - "tests/personnel-pack/**"
      - "tests/e2e/personnel-pack-sandbox.test.ts"
      - "docs/personnel-pack-fulfillment-security.md"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/personnel-pack-fulfillment-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/api/personnel-pack-download/**"
      - "lib/personnel-pack/**"
      - "lib/personnelPackDownloadClaims.ts"
      - "tests/personnel-pack-fulfillment*.test.ts"
      - "prisma/**"
      - "app/personnel-pack/EmailGateForm.tsx"
      - "lib/emailValidation.ts"
      - "lib/notify.ts"
      - "lib/personnelPackFulfillment.ts"
      - "lib/supabase.ts"
      - "public/personnel-pack-assets/**"
      - "tests/personnel-pack/**"
      - "tests/e2e/personnel-pack-sandbox.test.ts"
      - "docs/personnel-pack-fulfillment-security.md"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/personnel-pack-fulfillment-ci.yml"

permissions:
  contents: read

concurrency:
  group: lims-box-personnel-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: [self-hosted, daisy]
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/fixture?connect_timeout=1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Personnel Pack fulfillment tests
        run: npm run test:personnel-pack

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

  sandbox-e2e:
    # F2: manual proof of gate -> claim -> download -> replay refused on a preview.
    # The gate request uses Resend's sink address delivered@resend.dev; no customer mail.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, daisy]
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PP_SANDBOX_PREVIEW_URL: ${{ inputs.preview_url }}
      PP_SANDBOX_E2E_CONFIRM: preview
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Personnel Pack sandbox end-to-end proof
        run: npm run test:personnel-pack-sandbox-e2e
