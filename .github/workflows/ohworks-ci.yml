name: OHWorks CI

on:
  pull_request:
    paths:
      - "app/pilot/ohworks/**"
      - "fixtures/ohworks/**"
      - "lib/ohworks-pilot.ts"
      - "lib/ohworks-senaite/**"
      - "lib/ohworks-tenant/**"
      - "tests/attribution/**"
      - "tests/personnel-pack/**"
      - "tests/ohworks/**"
      - "tests/ohworks-runtime.mjs"
      - "deploy/ohworks-test-tenant/**"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - "prisma/**"
      - ".github/workflows/ohworks-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/pilot/ohworks/**"
      - "fixtures/ohworks/**"
      - "lib/ohworks-pilot.ts"
      - "lib/ohworks-senaite/**"
      - "lib/ohworks-tenant/**"
      - "tests/attribution/**"
      - "tests/personnel-pack/**"
      - "tests/ohworks/**"
      - "tests/ohworks-runtime.mjs"
      - "deploy/ohworks-test-tenant/**"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - "prisma/**"
      - ".github/workflows/ohworks-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run attribution tests
        run: npm run test:attribution

      - name: Run personnel pack tests
        run: npm run test:personnel-pack

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run OHWorks tests
        run: npm run test:ohworks

      - name: Run OHWorks runtime tests
        run: npm run test:ohworks-runtime

      - name: Validate test-tenant Compose configuration
        shell: bash
        run: |
          empty_env_file="${RUNNER_TEMP}/ohworks-runtime-empty.env"
          : > "${empty_env_file}"
          OHWORKS_IMAGE="example.invalid/ohworks:ci-placeholder" \
          OHWORKS_RUNTIME_ENV_FILE="${empty_env_file}" \
          OHWORKS_BUNDLE_PATH="${RUNNER_TEMP}/ohworks-bundle-placeholder" \
          OHWORKS_SENAITE_SOURCE_PATH="${RUNNER_TEMP}/senaite-source-placeholder" \
          OHWORKS_CADDY_IMAGE="example.invalid/caddy:ci-placeholder" \
          OHWORKS_CANDIDATE_HOST="ohworks-ci.invalid" \
          OHWORKS_CANDIDATE_PORT="43218" \
          OHWORKS_SENAITE_NETWORK="ohworks-ci-private" \
          OHWORKS_PERSONNEL_VOLUME="ohworks-ci-personnel" \
            docker compose --env-file "${empty_env_file}" \
              -f deploy/ohworks-test-tenant/compose.yaml config --quiet
